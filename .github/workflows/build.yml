name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer and Cython
        run: |
          pip3 install --user --upgrade buildozer cython==0.29.33 virtualenv

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          (yes || true) | buildozer android debug > build.log 2>&1 || (grep -v "^#" build.log | tail -n 50 && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
